<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>予定統合アプリ</title>
  <!-- セキュリティ方針：CDN/外部通信なし。Excel読み書きライブラリは同じフォルダ配下の libs から読み込みます。 -->
  <script src="./libs/xlsx.bundle.js"></script>
  <script>
    if(!window.XLSX){
      document.write('<script src="./libs/xlsx.full.min.js"><\/script>');
    }
  </script>
  <script>
    window.addEventListener('DOMContentLoaded', function(){
      if(!window.XLSX){
        const msg = 'Excel読み取りライブラリが見つかりません。\n' +
          '外部CDNは使わない設定です。HTMLと同じ場所に libs フォルダを作り、\n' +
          'libs/xlsx.bundle.js または libs/xlsx.full.min.js を置いてください。';
        console.warn(msg);
        const st = document.getElementById('status');
        if(st) st.textContent = msg;
      }
    });
  </script>
<style>
:root{
  --bg:#f4f6fb;--card:#fff;--line:#d8deea;--text:#172033;--muted:#667085;
  --accent:#2563eb;--accent2:#1d4ed8;--ok:#16a34a;--warn:#dc2626;--soft:#eef4ff;
  --shadow:0 6px 18px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.headerInner{max-width:1680px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
h1{font-size:20px;margin:0;font-weight:900;letter-spacing:.01em;}
.headerHint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:3px;}
.headerActions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;}
.wrap{max-width:1680px;margin:0 auto;padding:14px 16px 20px;}
.controlGrid{display:grid;grid-template-columns:minmax(360px,1.2fr) minmax(330px,.9fr) minmax(360px,1.15fr) 280px;gap:12px;align-items:stretch;margin-bottom:12px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:var(--shadow);}
.cardTitle{display:flex;align-items:center;gap:8px;font-weight:900;margin:0 0 10px;font-size:15px;}
.step{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;background:var(--accent);color:#fff;font-weight:900;font-size:12px;padding:0 7px;}
.hint{font-size:12px;color:var(--muted);line-height:1.5;}
label{font-size:12px;color:#475467;display:block;margin:9px 0 5px;font-weight:800;}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#fff;font:inherit;font-size:13px;}
input[type=file]{padding:7px;background:#fafafa;}
input[type=checkbox]{width:auto;margin-right:6px;}
button{border:0;border-radius:8px;padding:9px 12px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer;margin:0;font-size:13px;white-space:nowrap;}
button.secondary{background:#475467;}
button.ghost{background:#eef2ff;color:#1e40af;}
button.ok{background:var(--ok);}
button.saveImportant{background:#dc2626;color:#fff;box-shadow:0 0 0 3px rgba(220,38,38,.14);}
button.saveImportant:hover{background:#b91c1c;}
button:disabled{opacity:.45;cursor:not-allowed;}
.btnRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
.primaryAction{font-size:14px;padding:11px 14px;}
.bundleActionGrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:0;width:100%;}
.bundleActionGrid button{width:100%;max-width:100%;min-width:0;white-space:normal;line-height:1.35;text-align:center;overflow-wrap:anywhere;}
@media (min-width:1500px){.bundleActionGrid{grid-template-columns:1fr 1fr;}}
.drop{border:2px dashed #c7d2fe;background:#f8fbff;border-radius:8px;padding:10px;text-align:center;color:#475569;margin-top:8px;font-size:12px;}
.drop.drag{background:#eef2ff;border-color:#2563eb;}
.compactFields{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.smallrow{display:flex;align-items:center;gap:8px;}
.checkGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:4px;}
.checkGrid label{font-size:12px;font-weight:600;margin:0;color:#344054;}
details{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fafafa;margin-top:9px;}
summary{cursor:pointer;font-weight:900;font-size:13px;}
#status{white-space:pre-wrap;background:#0f172a;color:#e5e7eb;border-radius:8px;padding:10px;min-height:126px;font-size:12px;line-height:1.45;overflow:auto;}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:10px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.stat .hint{display:block;line-height:1.2;}
.stat b{display:block;font-size:19px;margin-top:2px;}
.tabs{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;position:sticky;top:73px;z-index:10;background:rgba(244,246,251,.94);backdrop-filter:blur(8px);padding:8px 0;}
.previewCard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:var(--shadow);}
.previewWrap{overflow:auto;height:calc(100vh - 285px);min-height:460px;border:1px solid var(--line);border-radius:8px;background:#fff;}
.hidden{display:none!important;}
table{border-collapse:collapse;background:#fff;width:max-content;min-width:100%;}
th,td{border:1px solid #98a2b3;padding:6px 8px;vertical-align:top;min-width:110px;max-width:260px;white-space:pre-wrap;word-break:break-word;font-size:12px;}
th{background:#f2f4f7;position:sticky;top:0;z-index:2;}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:#fff;font-weight:700;min-width:140px;}
th:first-child{z-index:3;background:#e5e7eb;}
.subtle{color:var(--muted);font-size:11px;}
@media (max-width:1280px){
  .controlGrid{grid-template-columns:1fr 1fr;}
  .previewWrap{height:62vh;}
}
@media (max-width:760px){
  .headerInner{align-items:flex-start;flex-direction:column;}
  .controlGrid{grid-template-columns:1fr;}
  .compactFields,.checkGrid,.stats{grid-template-columns:1fr;}
  .tabs{top:106px;}
  .previewWrap{height:62vh;min-height:360px;}
}
@media print{
  header,.controlGrid,.tabs{display:none!important;}
  .wrap{padding:0;}
  .previewCard{border:0;box-shadow:none;padding:0;}
  .previewWrap{height:auto;overflow:visible;border:0;}
}

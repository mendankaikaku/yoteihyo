<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>予定表PDF 自動罫線検出＋高校予定語群補正（語群・設定保存対応）</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--bg:#f7f8fb;--card:#fff;--line:#d9dee8;--text:#1f2937;--muted:#667085;--accent:#2563eb;}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);}
    header{padding:18px 24px;background:#fff;border-bottom:1px solid var(--line);}
    h1{font-size:20px;margin:0 0 6px;}
    .wrap{display:grid;grid-template-columns:340px 1fr;gap:18px;padding:18px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
    label{font-size:13px;color:var(--muted);display:block;margin:12px 0 6px;}
    input[type=file],textarea,input[type=number]{width:100%;box-sizing:border-box;}
    input[type=number]{padding:8px;border:1px solid var(--line);border-radius:8px;}
    button{border:0;border-radius:10px;padding:10px 12px;background:var(--accent);color:white;font-weight:700;cursor:pointer;margin:6px 4px 6px 0;}
    button.secondary{background:#475467;}
    button.ghost{background:#eef2ff;color:#1e40af;}
    button:disabled{opacity:.5;cursor:not-allowed;}
    .hint{font-size:12px;color:var(--muted);line-height:1.6;}
    #status{white-space:pre-wrap;background:#0f172a;color:#e5e7eb;border-radius:10px;padding:10px;min-height:54px;font-size:12px;}
    canvas{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;}
    table{border-collapse:collapse;background:#fff;width:max-content;min-width:100%;}
    th,td{border:1px solid #98a2b3;padding:6px;vertical-align:top;min-width:120px;}
    th{background:#f2f4f7;}
    td[contenteditable]{background:#fff;}
    .cell-img{max-width:150px;max-height:70px;display:block;margin-bottom:4px;border:1px solid #eee;}
    .suggest{font-size:11px;margin-top:4px;color:#344054;}
    .chip{display:inline-block;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:2px 7px;margin:2px;cursor:pointer;}
    .tabs{display:flex;gap:8px;margin-bottom:10px;}
    .previewWrap{overflow:auto;max-height:74vh;}
    textarea{height:170px;border:1px solid var(--line);border-radius:10px;padding:8px;font-family:ui-monospace,Consolas,monospace;font-size:12px;}
    .small{font-size:12px;color:var(--muted);}
  </style>
</head>
<body>
<header>
  <h1>予定表PDF 自動罫線検出＋高校予定語群補正（語群・設定保存対応）</h1>
  <div class="hint">PDFは外部送信しません。ライブラリとOCRモデルはブラウザが読み込みます。罫線でセル切り出し→画像確認→手入力補正→Excel出力できます。</div>
</header>

<div class="wrap">
  <section class="card">
    <label>PDFを選択</label>
    <input id="pdfFile" type="file" accept="application/pdf" />

    <label>レンダリング倍率</label>
    <input id="scale" type="number" min="1" max="5" step="0.25" value="3" />

    <label>罫線検出しきい値（暗さ）</label>
    <input id="threshold" type="number" min="0" max="255" step="1" value="185" />

    <label>縦線の最小長さ比</label>
    <input id="vMinRatio" type="number" min="0.05" max="0.95" step="0.05" value="0.65" />

    <label>縦線の連続性しきい値</label>
    <input id="vContinuity" type="number" min="0.1" max="0.95" step="0.05" value="0.55" />

    <label>横線の最小長さ比</label>
    <input id="hMinRatio" type="number" min="0.05" max="0.95" step="0.05" value="0.35" />

    <label>近い線をまとめる幅(px)</label>
    <input id="mergeGap" type="number" min="2" max="80" step="1" value="18" />

    <label>時間割の段数（その他やることを除く）</label>
    <input id="periodCount" type="number" min="1" max="10" step="1" value="7" />

    <label>日付の列数</label>
    <input id="dateColumnCount" type="number" min="1" max="14" step="1" value="7" />

    <label>左端の時限列の幅倍率</label>
    <input id="timeColRatio" type="number" min="0.5" max="3" step="0.1" value="1.35" />

    <button id="loadBtn">PDF表示</button>
    <button id="detectBtn" class="secondary">自動罫線検出</button>
    <button id="makeBtn" class="ghost">セル確認表を作成</button>
    <button id="ocrBtn" class="secondary">OCR＋語群補正</button>
    <button id="excelBtn">Excel出力</button>
    <button id="htmlBtn" class="secondary">HTML保存</button>

    <label>高校予定語群（追加・編集可）</label>
    <textarea id="dict"></textarea>
    <button id="saveDictBtn" class="secondary" type="button">語群を保存</button>
    <button id="resetDictBtn" class="ghost" type="button">初期語群に戻す</button>
    <button id="saveSettingsBtn" class="secondary" type="button">設定を保存</button>
    <button id="resetSettingsBtn" class="ghost" type="button">設定を初期化</button>
    <div class="hint">語群と倍率などの設定はこのブラウザに保存され、次回開いても残ります。OCRが弱くても、候補チップを押すとセルに入ります。「数学①」「英語②」などに加えて、最下段の「その他やること」も出力対象です。左端の時限列が広すぎ/狭すぎる場合は「左端の時限列の幅倍率」を調整してください。縦線は文字の縦成分を除外する方式にしています。</div>

    <label>状態</label>
    <div id="status">待機中</div>
  </section>

  <main class="card">
    <div class="tabs">
      <button class="ghost" onclick="showPane('canvasPane')">罫線プレビュー</button>
      <button class="ghost" onclick="showPane('tablePane')">編集表</button>
    </div>
    <div id="canvasPane">
      <canvas id="canvas"></canvas>
    </div>
    <div id="tablePane" class="previewWrap" style="display:none;">
      <div id="tableHost" class="small">まだ表がありません。</div>
    </div>
  </main>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const defaultWords = [
"数学","数学①","数学②","数学③","数学Ⅰ","数学Ⅱ","数学Ⅲ","数学A","数学B","数学C",
"英語","英語①","英語②","英語③","英文法","英単語","長文","リスニング","国語","現代文","古文","漢文",
"物理","化学","生物","地学","物理基礎","化学基礎","生物基礎","地学基礎",
"日本史","世界史","地理","倫理","政治経済","公共","情報","情報Ⅰ","保健","体育","音楽","美術","家庭科",
"教科書","ワーク","問題集","単語帳","チャート","青チャート","黄チャート","重問","過去問","模試","復習","予習","課題","宿題","小テスト","定期テスト",
"受講","授業","補習","自習","LHR","総合","探究","面談","講習",
"部活","練習","朝練","午後練","自主練","筋トレ","試合","大会","遠征","ミーティング",
"休み","オフ","休日","祝日","学校休み","午前休","午後休","欠席","早退","病院","用事","塾","その他やること","持ち物","提出物","掃除","委員会","生徒会","買い物","確認","連絡","予約","プリント"
];

const DICT_STORAGE_KEY = "yoteihyo_highschool_words_user_dict_v1";

function loadDictionary(){
  const saved = localStorage.getItem(DICT_STORAGE_KEY);
  document.getElementById("dict").value = saved && saved.trim() ? saved : defaultWords.join("\n");
}

function saveDictionary(){
  localStorage.setItem(DICT_STORAGE_KEY, document.getElementById("dict").value);
  log("語群を保存しました。次回このHTMLを開いても残ります。");
}

function resetDictionary(){
  if(confirm("追加した語群を消して、初期語群に戻しますか？")){
    localStorage.removeItem(DICT_STORAGE_KEY);
    document.getElementById("dict").value = defaultWords.join("\n");
    log("語群を初期状態に戻しました。");
  }
}

loadDictionary();

document.getElementById("saveDictBtn").onclick = saveDictionary;
document.getElementById("resetDictBtn").onclick = resetDictionary;

// 入力のたびに自動保存（閉じても残る）
let dictSaveTimer = null;
document.getElementById("dict").addEventListener("input", () => {
  clearTimeout(dictSaveTimer);
  dictSaveTimer = setTimeout(() => {
    localStorage.setItem(DICT_STORAGE_KEY, document.getElementById("dict").value);
  }, 400);
});

// 倍率・罫線検出などの設定も保存
const SETTINGS_STORAGE_KEY = "yoteihyo_detector_settings_v1";
const SETTING_IDS = [
  "scale",
  "threshold",
  "vMinRatio",
  "vContinuity",
  "hMinRatio",
  "mergeGap",
  "periodCount",
  "dateColumnCount",
  "timeColRatio"
];

function loadSettings(){
  try{
    const saved = JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY) || "{}");
    for(const id of SETTING_IDS){
      const el = document.getElementById(id);
      if(el && saved[id] !== undefined) el.value = saved[id];
    }
  }catch(e){
    console.warn("設定読み込み失敗", e);
  }
}

function saveSettings(showMessage=true){
  const obj = {};
  for(const id of SETTING_IDS){
    const el = document.getElementById(id);
    if(el) obj[id] = el.value;
  }
  localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(obj));
  if(showMessage) log("設定を保存しました。次回このHTMLを開いても残ります。");
}

function resetSettings(){
  if(confirm("倍率や罫線検出などの設定を初期値に戻しますか？")){
    localStorage.removeItem(SETTINGS_STORAGE_KEY);
    const defaults = {
      scale: "3",
      threshold: "185",
      vMinRatio: "0.65",
      vContinuity: "0.55",
      hMinRatio: "0.35",
      mergeGap: "18",
      periodCount: "7",
      dateColumnCount: "7",
      timeColRatio: "1.35"
    };
    for(const [id,val] of Object.entries(defaults)){
      const el = document.getElementById(id);
      if(el) el.value = val;
    }
    log("設定を初期化しました。");
  }
}

loadSettings();

document.getElementById("saveSettingsBtn").onclick = () => saveSettings(true);
document.getElementById("resetSettingsBtn").onclick = resetSettings;

// 設定も変更のたびに自動保存
for(const id of SETTING_IDS){
  const el = document.getElementById(id);
  if(el){
    el.addEventListener("input", () => saveSettings(false));
    el.addEventListener("change", () => saveSettings(false));
  }
}


let pageCanvas = document.getElementById("canvas");
let ctx = pageCanvas.getContext("2d");
let imgData = null, detectedX = [], detectedY = [], cellBoxes = [], pdfTextItems = [];

function log(s){ document.getElementById("status").textContent = s; }
function showPane(id){
  document.getElementById("canvasPane").style.display = id==="canvasPane" ? "block":"none";
  document.getElementById("tablePane").style.display = id==="tablePane" ? "block":"none";
}

document.getElementById("loadBtn").onclick = async () => {
  try{
    const file = document.getElementById("pdfFile").files[0];
    if(!file) return alert("PDFを選んでください");
    log("PDF読み込み中...");
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    const page = await pdf.getPage(1);
    const scale = Number(document.getElementById("scale").value || 3);
    const viewport = page.getViewport({scale});
    pageCanvas.width = viewport.width; pageCanvas.height = viewport.height;
    await page.render({canvasContext:ctx, viewport}).promise;
    imgData = ctx.getImageData(0,0,pageCanvas.width,pageCanvas.height);
    const textContent = await page.getTextContent();
    pdfTextItems = textContent.items.map(it => ({str:it.str, tr:it.transform}));
    log(`PDF表示完了: ${Math.round(viewport.width)}×${Math.round(viewport.height)}px\n次に「自動罫線検出」を押してください。`);
  }catch(e){ log("エラー: "+e.message); console.error(e); }
};

function isDarkAt(data,w,x,y,thr){
  const i=(y*w+x)*4; const r=data[i],g=data[i+1],b=data[i+2];
  return (r+g+b)/3 < thr;
}
function segmentsFromProjection(arr,minRun=2){
  const seg=[]; let s=-1;
  for(let i=0;i<arr.length;i++){
    if(arr[i] && s<0) s=i;
    if((!arr[i] || i===arr.length-1) && s>=0){
      let e = arr[i]?i:i-1;
      if(e-s+1>=minRun) seg.push([s,e]);
      s=-1;
    }
  }
  return seg.map(([a,b])=>Math.round((a+b)/2));
}
function mergeClose(vals,gap){
  vals=[...vals].sort((a,b)=>a-b);
  const out=[]; let group=[];
  for(const v of vals){
    if(group.length===0 || v-group[group.length-1]<=gap) group.push(v);
    else { out.push(Math.round(group.reduce((a,b)=>a+b,0)/group.length)); group=[v]; }
  }
  if(group.length) out.push(Math.round(group.reduce((a,b)=>a+b,0)/group.length));
  return out;
}

document.getElementById("detectBtn").onclick = () => {
  try{
    if(!imgData) return alert("先にPDF表示してください");
    const w=pageCanvas.width,h=pageCanvas.height;
    const thr=Number(document.getElementById("threshold").value);
    const vMin=Math.floor(h*Number(document.getElementById("vMinRatio").value));
    const hMin=Math.floor(w*Number(document.getElementById("hMinRatio").value));
    const mergeGap=Number(document.getElementById("mergeGap").value);
    const vContinuity=Number(document.getElementById("vContinuity")?.value || 0.55);

    function maxRunInColumn(x){
      let maxRun=0, run=0;
      for(let y=0;y<h;y++){
        if(isDarkAt(imgData.data,w,x,y,thr)){ run++; if(run>maxRun) maxRun=run; }
        else run=0;
      }
      return maxRun;
    }

    function maxRunInRow(y){
      let maxRun=0, run=0;
      for(let x=0;x<w;x++){
        if(isDarkAt(imgData.data,w,x,y,thr)){ run++; if(run>maxRun) maxRun=run; }
        else run=0;
      }
      return maxRun;
    }

    // 縦線：暗い点の総数だけでなく「連続して長い線」だけ採用
    // これで 1限 や時刻の文字の縦成分を罫線として拾いにくくする
    const colDark = new Array(w).fill(0);
    const colMaxRun = new Array(w).fill(0);
    const rowDark = new Array(h).fill(0);

    for(let x=0;x<w;x++){
      let count=0, maxRun=0, run=0;
      for(let y=0;y<h;y++){
        if(isDarkAt(imgData.data,w,x,y,thr)){
          count++; run++;
          if(run>maxRun) maxRun=run;
        }else run=0;
      }
      colDark[x]=count;
      colMaxRun[x]=maxRun;
    }

    for(let y=0;y<h;y++){
      let count=0;
      for(let x=0;x<w;x++){
        if(isDarkAt(imgData.data,w,x,y,thr)) count++;
      }
      rowDark[y]=count;
    }

    let xs = segmentsFromProjection(
      colDark.map((v,i)=> v>=vMin && colMaxRun[i] >= Math.floor(h*vContinuity)),
      1
    );

    // 横線は今まで通り。横線はうまくいっている前提で弱めに拾う
    let ys = segmentsFromProjection(rowDark.map(v=>v>=hMin), 1);

    detectedX = mergeClose(xs, mergeGap);
    detectedY = mergeClose(ys, mergeGap);

    // 表の外枠候補が足りない場合に備えて、端に近い強い線を優先
    // ただし文字由来の短い線は既に除外済み
    ctx.putImageData(imgData,0,0);
    ctx.save();
    ctx.lineWidth=3;
    ctx.strokeStyle="rgba(37,99,235,.85)";
    for(const x of detectedX){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    ctx.strokeStyle="rgba(220,38,38,.85)";
    for(const y of detectedY){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    ctx.restore();

    log(`罫線検出完了\n縦線: ${detectedX.length}本\n横線: ${detectedY.length}本\n青=縦線、赤=横線\n文字の縦成分を除外する強めの縦線検出です。\n次に「セル確認表を作成」。`);
    showPane("canvasPane");
  }catch(e){ log("エラー: "+e.message); console.error(e); }
};

function cropToDataURL(box, pad=3){
  const [x1,y1,x2,y2]=box;
  const x=Math.max(0,x1+pad), y=Math.max(0,y1+pad);
  const ww=Math.max(1,x2-x1-2*pad), hh=Math.max(1,y2-y1-2*pad);
  const c=document.createElement("canvas"); c.width=ww; c.height=hh;
  c.getContext("2d").drawImage(pageCanvas,x,y,ww,hh,0,0,ww,hh);
  return c.toDataURL("image/png");
}



function getAdjustedXLines(){
  // User setting controls final number of columns.
  // Left side "1限 9:00~10:30" may contain vertical-looking text, so do not trust all detected inner lines.
  // Use the detected outer table bounds, then allocate: 1 left time column + N date columns.
  const xs=[...detectedX].sort((a,b)=>a-b);
  if(xs.length < 2) return xs;

  const dateColumnCount = Number(document.getElementById("dateColumnCount")?.value || 7);
  const timeColRatio = Number(document.getElementById("timeColRatio")?.value || 1.35);

  // Prefer wide outer bounds, ignoring stray text-like lines near the left.
  const left = xs[0];
  const right = xs[xs.length - 1];

  const totalW = right - left;
  const unit = totalW / (timeColRatio + dateColumnCount);

  const out = [Math.round(left), Math.round(left + timeColRatio * unit)];
  for(let i=1;i<=dateColumnCount;i++){
    out.push(Math.round(left + timeColRatio * unit + i * unit));
  }
  return out;
}

function getAdjustedYLines(){
  // Keep detected top/date/weekday lines, then force body rows to periodCount + "その他やること"
  // when the detected horizontal lines are one row short.
  const ys=[...detectedY].sort((a,b)=>a-b);
  if(ys.length < 4) return ys;

  const periodCount = Number(document.getElementById("periodCount")?.value || 7);
  const desiredBodyRows = periodCount + 1; // periods + その他やること
  const desiredTotalLines = 3 + desiredBodyRows; // top, date bottom, weekday bottom, body row borders

  if(ys.length === desiredTotalLines) return ys;

  // If the PDF grid detected outer/header lines but body divisions are short,
  // interpolate body lines from after weekday row to bottom border.
  // Preserve first 3 lines as: table top, date/weekday separator, weekday/body separator.
  if(ys.length >= 4 && Math.abs(ys.length - desiredTotalLines) <= 3){
    const topLines = ys.slice(0,3);
    const bottom = ys[ys.length-1];
    const start = topLines[2];
    const step = (bottom - start) / desiredBodyRows;
    const bodyLines = [];
    for(let i=1;i<=desiredBodyRows;i++) bodyLines.push(Math.round(start + step*i));
    return [...topLines, ...bodyLines];
  }
  return ys;
}

function guessHeaders(){
  const xs=getAdjustedXLines(), ys=getAdjustedYLines();
  const cols=Math.max(0,xs.length-1), rows=Math.max(0,ys.length-1);

  const dateColumnCount = Number(document.getElementById("dateColumnCount")?.value || 7);
  const allDates=["5月25日","5月26日","5月27日","5月28日","5月29日","5月30日","5月31日","6月1日","6月2日","6月3日","6月4日","6月5日","6月6日","6月7日"];
  const allWeekdays=["月曜日","火曜日","水曜日","木曜日","金曜日","土曜日","日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日","日曜日"];
  const dates=allDates.slice(0, dateColumnCount);
  const weekdays=allWeekdays.slice(0, dateColumnCount);

  const periodCount = Number(document.getElementById("periodCount")?.value || 7);
  const bodyRows=Math.max(0, rows-2);
  let times=[];
  for(let i=1;i<=Math.min(periodCount, Math.max(0, bodyRows-1));i++) times.push(i+"限");
  if(bodyRows >= 1) times.push("その他やること");

  return {cols,rows,dates,weekdays,times,xs,ys};
}

document.getElementById("makeBtn").onclick = () => {
  try{
    if(detectedX.length<3 || detectedY.length<3) return alert("罫線が足りません。先に検出してください。");
    const {cols,rows,dates,weekdays,times,xs,ys}=guessHeaders();
    cellBoxes=[];
    let html="<table id='editTable'><tbody>";

    for(let r=0;r<rows;r++){
      html+="<tr>";
      for(let c=0;c<cols;c++){
        const box=[xs[c],ys[r],xs[c+1],ys[r+1]];
        const dataUrl=cropToDataURL(box);
        const isHeader = (r<2 || c===0);
        let val="";
        if(r===0 && c>0) val=dates[c-1]||"";
        else if(r===1 && c>0) val=weekdays[c-1]||"";
        else if(c===0 && r>=2) val=times[r-2]||"";
        const tag=isHeader?"th":"td";
        const editable=isHeader?"contenteditable='true'":"contenteditable='true'";
        html+=`<${tag} ${editable} data-r="${r}" data-c="${c}">
          ${!isHeader ? `<img class="cell-img" src="${dataUrl}">` : ""}
          <div class="cell-text">${escapeHtml(val)}</div>
          ${!isHeader ? `<div class="suggest" data-suggest="${r}-${c}"></div>` : ""}
        </${tag}>`;
        cellBoxes.push({r,c,box,dataUrl});
      }
      html+="</tr>";
    }
    html+="</tbody></table>";
    document.getElementById("tableHost").innerHTML=html;
    log("セル確認表を作成しました。\n手書き画像を見ながら直接セルを編集できます。時間割の段数・日付の列数・左端の時限列幅が合わない場合は左の設定を変えて再作成してください。\nOCRしたい場合は「OCR＋語群補正」。");
    showPane("tablePane");
  }catch(e){ log("エラー: "+e.message); console.error(e); }
};

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
function getWords(){
  const base=document.getElementById("dict").value.split(/\n|,|、/).map(s=>s.trim()).filter(Boolean);
  const nums=["①","②","③","④","⑤","⑥","⑦","1","2","3","4","5","Ⅰ","Ⅱ","Ⅲ","A","B","C"];
  const subjects=["数学","英語","国語","物理","化学","生物","地学","日本史","世界史","地理","情報","体育"];
  const expanded=[...base];
  for(const s of subjects) for(const n of nums) expanded.push(s+n);
  return [...new Set(expanded)];
}
function levenshtein(a,b){
  a=normalizeJP(a); b=normalizeJP(b);
  const dp=Array(a.length+1).fill(0).map(()=>Array(b.length+1).fill(0));
  for(let i=0;i<=a.length;i++) dp[i][0]=i;
  for(let j=0;j<=b.length;j++) dp[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  return dp[a.length][b.length];
}
function normalizeJP(s){
  return String(s).replace(/\s/g,"").replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/[①]/g,"1").replace(/[②]/g,"2").replace(/[③]/g,"3").replace(/[④]/g,"4").replace(/[⑤]/g,"5")
    .replace(/[⑥]/g,"6").replace(/[⑦]/g,"7").toLowerCase();
}
function suggestionsFor(text){
  const words=getWords();
  let scored=words.map(w=>({w,d:levenshtein(text,w)}));
  if(text.trim()==="") scored=words.slice(0,12).map(w=>({w,d:0}));
  scored.sort((a,b)=>a.d-b.d || a.w.length-b.w.length);
  return scored.slice(0,6).map(x=>x.w);
}
function setCellText(td, text){
  const div=td.querySelector(".cell-text");
  if(div) div.textContent=text; else td.textContent=text;
}

document.getElementById("ocrBtn").onclick = async () => {
  try{
    const table=document.getElementById("editTable");
    if(!table) return alert("先にセル確認表を作成してください");
    log("OCR準備中... 初回は少し時間がかかります。");
    const worker = await Tesseract.createWorker("jpn+eng");
    const cells=[...table.querySelectorAll("td")].filter(td=>td.querySelector(".cell-img"));
    let i=0;
    for(const td of cells){
      i++;
      log(`OCR中 ${i}/${cells.length} ...`);
      const img=td.querySelector(".cell-img").src;
      let result="";
      try{
        const rec=await worker.recognize(img);
        result=(rec.data.text||"").trim().replace(/\n+/g," ");
      }catch(_){}
      if(result) setCellText(td,result);
      const sug=td.querySelector(".suggest");
      if(sug){
        const arr=suggestionsFor(result);
        sug.innerHTML="候補: "+arr.map(w=>`<span class="chip" onclick="setCellText(this.closest('td'),'${escapeAttr(w)}')">${escapeHtml(w)}</span>`).join("");
      }
    }
    await worker.terminate();
    log("OCR＋語群候補の作成完了。\n候補チップを押すか、セルを直接編集してからExcel出力してください。");
  }catch(e){ log("エラー: "+e.message); console.error(e); }
};
function escapeAttr(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

function tableToAOA(){
  const table=document.getElementById("editTable");
  if(!table) return [];
  return [...table.rows].map(row=>[...row.cells].map(cell=>{
    const div=cell.querySelector(".cell-text");
    return (div?div.textContent:cell.textContent).replace(/候補:.*/s,"").trim();
  }));
}

document.getElementById("excelBtn").onclick = () => {
  const aoa=tableToAOA();
  if(!aoa.length) return alert("表がありません");
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = aoa[0].map((_,i)=>({wch: i===0 ? 16 : 18}));
  XLSX.utils.book_append_sheet(wb,ws,"予定表");
  XLSX.writeFile(wb,"yoteihyo_schedule.xlsx");
};

document.getElementById("htmlBtn").onclick = () => {
  const host=document.getElementById("tableHost").cloneNode(true);
  host.querySelectorAll("img,.suggest").forEach(e=>e.remove());
  const content=`<!doctype html><html lang="ja"><meta charset="utf-8"><style>table{border-collapse:collapse}td,th{border:1px solid #555;padding:8px;min-width:110px}th{background:#eee}</style><body>${host.innerHTML}</body></html>`;
  const blob=new Blob([content],{type:"text/html"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="yoteihyo_schedule.html"; a.click();
};
